<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>작업일보</title>
    <style>
        /* PDF 스타일링 */
        @page {
            size: A4;
            margin: 0;
        }
        body {
            font-family: 'KoreanFont', sans-serif;
            font-size: 11pt;
            line-height: 1.6;
            margin: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 24pt;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .section {
            margin: 20px 0;
        }
        .section h2 {
            font-size: 14pt;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f0f0f0;
            font-weight: bold;
        }
        .info-table th {
            width: 25%;
        }
        .info-table td {
            width: 75%;
        }
        .two-col th {
            width: 25%;
        }
        .two-col td {
            width: 25%;
        }
        .content-box {
            border: 1px solid #000;
            padding: 15px;
            min-height: 120px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .material-table th {
            width: 33%;
            text-align: center;
        }
        .material-table td {
            text-align: center;
        }
        .footer {
            text-align: right;
            margin-top: 30px;
            font-size: 10pt;
        }
    </style>
</head>
<body>
    <!-- 작업일보 헤더 -->
    <div class="header">
        <h1>작 업 일 보</h1>
    </div>

    <!-- 1. 현장 기본 정보 -->
    <div class="section">
        <h2>1. 현장 정보</h2>
        <table class="info-table">
            <tr>
                <th>현장명</th>
                <td th:text="${site != null and site.siteName != null ? site.siteName : '-'}"></td>
            </tr>
            <tr>
                <th>현장 주소</th>
                <td th:text="${site != null and site.siteAddress != null ? site.siteAddress : '-'}"></td>
            </tr>
            <tr>
                <th>공사 기간</th>
                <td>
                    <span th:if="${site != null and site.startDate != null and site.endDate != null}">
                        <span th:text="${#temporals.format(site.startDate, 'yyyy년 MM월 dd일')}"></span>
                        ~
                        <span th:text="${#temporals.format(site.endDate, 'yyyy년 MM월 dd일')}"></span>
                    </span>
                    <span th:if="${site == null or site.startDate == null or site.endDate == null}">-</span>
                </td>
            </tr>
        </table>
    </div>

    <!-- 2. 작성 정보 -->
    <div class="section">
        <h2>2. 작성 정보</h2>
        <table class="two-col">
            <tr>
                <th>작성일</th>
                <td th:text="${workReport != null and workReport.createdAt != null ? #temporals.format(workReport.createdAt, 'yyyy년 MM월 dd일') : '-'}"></td>
                <th>작성자</th>
                <td th:text="${managerName != null ? managerName : '-'}"></td>
            </tr>
        </table>
    </div>

    <!-- 3. 인력 투입 현황 -->
    <div class="section">
        <h2>3. 인력 투입 현황</h2>
        <table class="material-table">
            <thead>
                <tr>
                    <th>공정명</th>
                    <th>투입 인력</th>
                </tr>
            </thead>
            <tbody>
                <!-- 공정 목록이 있는 경우 -->
                <tr th:if="${workSections != null and !workSections.empty}" th:each="section : ${workSections}">
                    <td th:text="${section.sectionName != null ? section.sectionName : '-'}"></td>
                    <td>
                        <span th:if="${section.employeeNum != null}">
                            <span th:text="${section.employeeNum}"></span>명
                        </span>
                        <span th:if="${section.employeeNum == null}">-</span>
                    </td>
                </tr>
                <!-- 공정 목록이 없는 경우 -->
                <tr th:if="${workSections == null or workSections.empty}">
                    <td colspan="2" style="text-align: center; color: #999;">공정 정보가 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 4. 공정별 작업 내용 -->
    <div class="section">
        <h2>4. 공정별 작업 내용</h2>
        <!-- 공정 목록이 있는 경우 -->
        <div th:if="${workSections != null and !workSections.empty}" th:each="section, iterStat : ${workSections}">
            <h3 style="font-size: 12pt; margin: 10px 0 5px 0; font-weight: bold;">
                <span th:text="${iterStat.count}"></span>. <span th:text="${section.sectionName}"></span>
            </h3>
            <div class="content-box" style="min-height: 60px;" th:text="${section.context != null ? section.context : ''}"></div>
        </div>
        <!-- 공정 목록이 없는 경우 -->
        <div th:if="${workSections == null or workSections.empty}" class="content-box">작업 내용이 없습니다.</div>
    </div>

    <!-- 5. 자재 투입 현황 -->
    <div class="section">
        <h2>5. 자재 투입 현황</h2>
        <table class="material-table">
            <thead>
                <tr>
                    <th>품명</th>
                    <th>규격</th>
                    <th>단위</th>
                </tr>
            </thead>
            <tbody>
                <!-- 자재 목록이 있는 경우 -->
                <tr th:if="${materials != null and !materials.empty}" th:each="material : ${materials}">
                    <td th:text="${material.materialName != null ? material.materialName : '-'}"></td>
                    <td th:text="${material.materialStandard != null ? material.materialStandard : '-'}"></td>
                    <td th:text="${material.materialUnit != null ? material.materialUnit : '-'}"></td>
                </tr>
                <!-- 자재 목록이 없는 경우 -->
                <tr th:if="${materials == null or materials.empty}">
                    <td colspan="3" style="text-align: center; color: #999;">투입된 자재가 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 푸터 -->
    <div class="footer">
        <p>작성일: <span th:text="${workReport != null and workReport.createdAt != null ? #temporals.format(workReport.createdAt, 'yyyy년 MM월 dd일') : '-'}"></span></p>
    </div>
</body>
</html>
