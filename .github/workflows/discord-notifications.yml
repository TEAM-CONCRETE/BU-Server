name: Discord Notifications

on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification for new issue
        if: github.event_name == 'issues' && github.event.action == 'opened'
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "embeds": [{
              "title": "🆕 새 이슈 생성됨",
              "description": "**[${{ github.event.issue.title }}](${{ github.event.issue.html_url }})**",
              "color": 3447003,
              "fields": [
                {
                  "name": "작성자",
                  "value": "${{ github.event.issue.user.login }}",
                  "inline": true
                },
                {
                  "name": "번호",
                  "value": "#${{ github.event.issue.number }}",
                  "inline": true
                }
              ],
              "footer": {
                "text": "${{ github.repository }}"
              },
              "timestamp": "${{ github.event.issue.created_at }}"
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Send Discord notification for closed issue
        if: github.event_name == 'issues' && github.event.action == 'closed'
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "embeds": [{
              "title": "✅ 이슈 닫힘",
              "description": "**[${{ github.event.issue.title }}](${{ github.event.issue.html_url }})**",
              "color": 5763719,
              "fields": [
                {
                  "name": "작성자",
                  "value": "${{ github.event.issue.user.login }}",
                  "inline": true
                },
                {
                  "name": "번호",
                  "value": "#${{ github.event.issue.number }}",
                  "inline": true
                }
              ],
              "footer": {
                "text": "${{ github.repository }}"
              }
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Send Discord notification for issue comment
        if: github.event_name == 'issue_comment' && github.event.action == 'created'
        run: |
          COMMENT_BODY=$(echo '${{ github.event.comment.body }}' | head -c 200)
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"embeds\": [{
              \"title\": \"💬 새 코멘트\",
              \"description\": \"**[Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}](${{ github.event.comment.html_url }})**\n\n${COMMENT_BODY}...\",
              \"color\": 15258703,
              \"fields\": [
                {
                  \"name\": \"작성자\",
                  \"value\": \"${{ github.event.comment.user.login }}\",
                  \"inline\": true
                }
              ],
              \"footer\": {
                \"text\": \"${{ github.repository }}\"
              }
            }]
          }" \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Send Discord notification for new PR
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "embeds": [{
              "title": "🔀 새 Pull Request",
              "description": "**[${{ github.event.pull_request.title }}](${{ github.event.pull_request.html_url }})**",
              "color": 16753920,
              "fields": [
                {
                  "name": "작성자",
                  "value": "${{ github.event.pull_request.user.login }}",
                  "inline": true
                },
                {
                  "name": "번호",
                  "value": "#${{ github.event.pull_request.number }}",
                  "inline": true
                },
                {
                  "name": "브랜치",
                  "value": "${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}",
                  "inline": false
                }
              ],
              "footer": {
                "text": "${{ github.repository }}"
              }
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Send Discord notification for merged PR
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "embeds": [{
              "title": "✨ Pull Request 병합됨",
              "description": "**[${{ github.event.pull_request.title }}](${{ github.event.pull_request.html_url }})**",
              "color": 9055202,
              "fields": [
                {
                  "name": "작성자",
                  "value": "${{ github.event.pull_request.user.login }}",
                  "inline": true
                },
                {
                  "name": "병합자",
                  "value": "${{ github.event.pull_request.merged_by.login }}",
                  "inline": true
                },
                {
                  "name": "번호",
                  "value": "#${{ github.event.pull_request.number }}",
                  "inline": true
                }
              ],
              "footer": {
                "text": "${{ github.repository }}"
              }
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Send Discord notification for PR review
        if: github.event_name == 'pull_request_review' && github.event.action == 'submitted'
        run: |
          if [ "${{ github.event.review.state }}" == "approved" ]; then
            EMOJI="✅"
            COLOR=5763719
          elif [ "${{ github.event.review.state }}" == "changes_requested" ]; then
            EMOJI="🔴"
            COLOR=15158332
          else
            EMOJI="💭"
            COLOR=9807270
          fi
          
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"embeds\": [{
              \"title\": \"${EMOJI} PR 리뷰\",
              \"description\": \"**[PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}](${{ github.event.review.html_url }})**\",
              \"color\": ${COLOR},
              \"fields\": [
                {
                  \"name\": \"리뷰어\",
                  \"value\": \"${{ github.event.review.user.login }}\",
                  \"inline\": true
                },
                {
                  \"name\": \"상태\",
                  \"value\": \"${{ github.event.review.state }}\",
                  \"inline\": true
                }
              ],
              \"footer\": {
                \"text\": \"${{ github.repository }}\"
              }
            }]
          }" \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Send Discord notification for PR review comment
        if: github.event_name == 'pull_request_review_comment' && github.event.action == 'created'
        run: |
          COMMENT_BODY=$(echo '${{ github.event.comment.body }}' | head -c 200)
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"embeds\": [{
              \"title\": \"💬 PR 리뷰 코멘트\",
              \"description\": \"**[PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}](${{ github.event.comment.html_url }})**\n\n${COMMENT_BODY}...\",
              \"color\": 15258703,
              \"fields\": [
                {
                  \"name\": \"작성자\",
                  \"value\": \"${{ github.event.comment.user.login }}\",
                  \"inline\": true
                }
              ],
              \"footer\": {
                \"text\": \"${{ github.repository }}\"
              }
            }]
          }" \
          ${{ secrets.DISCORD_WEBHOOK }}
