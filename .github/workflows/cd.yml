name: Build-Up CD Pipeline

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:
    inputs:
      environment:
        description: '배포 환경'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      # ---------------------------------
      # 1. Repo Checkout
      # ---------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------
      # 2. Set up Java 21
      # ---------------------------------
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # ---------------------------------
      # 3. Gradle 빌드
      # ---------------------------------
      - name: 🏗️ Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test --no-daemon
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

      # ---------------------------------
      # 4. Docker 로그인
      # ---------------------------------
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------
      # 5. Docker Buildx 설정
      # ---------------------------------
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------
      # 6. Docker Image Build & Push
      # ---------------------------------
      - name: 🚀 Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/buildup:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/buildup:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------
      # 7. .env 파일 생성 (EC2 배포용)
      # ---------------------------------
      - name: 📝 Create .env file for deployment
        run: |
          cat << EOF > deployment.env
          # Spring 프로파일
          SPRING_PROFILES_ACTIVE=prod

          # JWT & 암호화
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}

          # 데이터베이스
          SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}

          # 관리자 계정
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}

          # AWS S3
          AWS_S3_ENABLED=${{ secrets.AWS_S3_ENABLED }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF

      # ---------------------------------
      # 8. .env 파일 EC2로 전송
      # ---------------------------------
      - name: 📤 Copy .env to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "deployment.env"
          target: "/home/ubuntu/buildup/"
          overwrite: true

      # ---------------------------------
      # 9. AWS EC2 배포
      # ---------------------------------
      - name: 🚀 Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/buildup
            
            # .env 파일 이름 변경
            mv deployment.env .env
            
            # Docker 이미지 Pull
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/buildup:latest
            
            # 기존 컨테이너 중지 및 삭제
            docker-compose down
            
            # 새 컨테이너 시작
            docker-compose up -d
            
            # 헬스 체크
            echo "⏳ 애플리케이션 시작 대기 중..."
            sleep 40
            
            # 헬스체크 시도 (최대 5번)
            for i in {1..5}; do
              if curl -f http://localhost:8080/api/actuator/health; then
                echo "✅ 애플리케이션 정상 실행 중"
                break
              else
                echo "⏳ 헬스체크 재시도 ($i/5)..."
                sleep 10
              fi
              
              if [ $i -eq 5 ]; then
                echo "❌ 헬스체크 실패"
                docker-compose logs --tail 100
                exit 1
              fi
            done
            
            # 이전 이미지 정리
            docker image prune -f
            
            echo "🎉 배포 완료!"

      # ---------------------------------
      # 10. 배포 알림
      # ---------------------------------
      - name: 📢 Notify Discord
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          
          if [ "${STATUS}" = "success" ]; then
            ICON="🚀"
            COLOR=3066993
            MESSAGE="Build-Up 배포 성공"
          else
            ICON="❌"
            COLOR=15158332
            MESSAGE="Build-Up 배포 실패"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "${ICON} ${MESSAGE}",
              "color": ${COLOR},
              "fields": [
                {
                  "name": "환경",
                  "value": "${{ github.event.inputs.environment || 'production' }}",
                  "inline": true
                },
                {
                  "name": "커밋",
                  "value": "\`${SHORT_SHA}\`",
                  "inline": true
                },
                {
                  "name": "작성자",
                  "value": "${{ github.actor }}",
                  "inline": true
                },
                {
                  "name": "서버",
                  "value": "http://${{ secrets.AWS_EC2_HOST }}:8080/api",
                  "inline": false
                }
              ],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            }]
          }
          EOF
          )

          curl -X POST \
            -H 'Content-Type: application/json' \
            --data "${PAYLOAD}" \
            ${{ secrets.DISCORD_WEBHOOK }}
