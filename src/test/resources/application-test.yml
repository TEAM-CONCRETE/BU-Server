spring:
  application:
    name: buildup-test

  # 테스트용 데이터베이스 설정 (로컬 MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/buildup?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
    username: buildup
    password: buildup123

  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # Flyway 비활성화 (테스트 환경)
  flyway:
    enabled: false

  # AWS S3 통합 테스트 설정
  # .env 파일의 환경변수를 사용합니다
  cloud:
    aws:
      s3:
        enabled: ${AWS_S3_ENABLED:false}
        bucket: ${AWS_S3_BUCKET:concrete-build-up}
      region:
        static: ${AWS_REGION:ap-northeast-2}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
      stack:
        auto: false

# 서버 설정 (테스트 환경)
# context-path를 제거하여 테스트 간소화
server:
  port: 0  # 랜덤 포트 사용

# JWT 테스트 설정
jwt:
  secret: test-secret-key-min-256-bits-long-for-hs256-algorithm-test
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
  refresh-token-remember-me-expiration: 2592000000

# 암호화 테스트 설정
security:
  encryption:
    key: 0123456789abcdef0123456789abcdef

# 로깅 설정
logging:
  level:
    root: INFO
    com.concrete.buildup: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
