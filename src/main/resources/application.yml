spring:
  application:
    name: buildup

  # 프로파일 설정
  profiles:
    active: dev  # 기본 활성 프로파일 (dev, prod)

  # 데이터베이스 설정 (공통)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 설정 (공통)
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false  # OSIV 비활성화 권장

# 서버 설정 (공통)
server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# 로깅 설정 (공통)
logging:
  level:
    root: INFO
    com.concrete.buildup: INFO

# JWT 설정
jwt:
  secret: ${JWT_SECRET:your-secret-key-min-256-bits-long-for-hs256-algorithm}
  access-token-expiration: 3600000  # 1시간 (ms)
  refresh-token-expiration: 604800000  # 7일 (ms)
  refresh-token-remember-me-expiration: 2592000000  # 30일 (ms)
