name: Build-Up CI Pipeline

on:
  pull_request:
    branches: [ 'main', 'develop' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------
      # 1. Repo Checkout
      # ---------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------
      # 2. Set up Java (Java 21 for Build-Up)
      # ---------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ---------------------------------
      # 3. 환경설정 YML 복원
      # Base64 -> application.yml 생성
      # ---------------------------------
      - name: Restore application.yml
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" | base64 --decode > ./src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_YML_PROD }}" | base64 --decode > ./src/main/resources/application-prod.yml

      # ---------------------------------
      # 4. Gradle 캐싱
      # ---------------------------------
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ---------------------------------
      # 5. Gradle Wrapper 실행 권한 부여
      # ---------------------------------
      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x ./gradlew

      # ---------------------------------
      # 6. Build + Test
      # ---------------------------------
      - name: Build and Test
        run: ./gradlew clean build test --no-daemon

      # ---------------------------------
      # 7. Docker Buildx 구성
      # ---------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------
      # 8. Docker Image Build (PR 미배포)
      # ---------------------------------
      - name: Build Docker image (without push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/buildup:pr-${{ github.event.pull_request.number }}
          load: true
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/buildup:buildcache

      # ---------------------------------
      # 9. Docker 컨테이너 실행 테스트
      # ---------------------------------
      - name: Test Docker container runs
        run: |
          docker run --rm -d --name buildup-test \
            -e SPRING_PROFILES_ACTIVE=prod \
            ${{ secrets.DOCKERHUB_USERNAME }}/buildup:pr-${{ github.event.pull_request.number }}

          echo "컨테이너 실행 대기..."
          sleep 25

          if docker ps | grep buildup-test; then
            echo "✅ Docker 컨테이너 정상 실행됨"
            docker logs buildup-test --tail 50
            docker stop buildup-test
          else
            echo "❌ Docker 컨테이너 실행 실패"
            docker logs buildup-test
            exit 1
          fi

      # ---------------------------------
      # 10. Slack 알림
      # ---------------------------------
      - name: Notify Discord CI Result
        if: always()
        run: |
          STATUS="${{ job.status }}"
          BRANCH="${{ github.ref_name }}"
          AUTHOR="${{ github.actor }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          if [ "${STATUS}" = "success" ]; then
            ICON="✅"
            MESSAGE="Build-Up CI 성공 (PR #${PR_NUMBER})"
          else
            ICON="❌"
            MESSAGE="Build-Up CI 실패 (PR #${PR_NUMBER})"
          fi

          curl -X POST \
            -H 'Content-Type: application/json' \
            --data "{\"text\": \"${ICON} ${MESSAGE}\\n브랜치: ${BRANCH}\\n작성자: ${AUTHOR}\\n로그: ${RUN_URL}\"}" \
            ${{ secrets.DISCORD_WEBHOOK }}
