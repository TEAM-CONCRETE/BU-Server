spring:
  application:
    name: buildup-test

  # 테스트용 데이터베이스 설정 (H2)
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  # Flyway 비활성화 (테스트 환경)
  flyway:
    enabled: false

  # H2 Console 활성화
  h2:
    console:
      enabled: true

  # AWS S3 자동 설정 비활성화
  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration

# JWT 테스트 설정
jwt:
  secret: test-secret-key-min-256-bits-long-for-hs256-algorithm-test
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
  refresh-token-remember-me-expiration: 2592000000

# 암호화 테스트 설정
security:
  encryption:
    key: test-encryption-key-32bytes!!

# 로깅 설정
logging:
  level:
    root: INFO
    com.concrete.buildup: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
