spring:
  application:
    name: buildup-backend

  # 데이터베이스 설정 (개발 환경)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/buildup?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
    username: buildup
    password: buildup123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA 설정 (개발 환경)
  jpa:
    hibernate:
      ddl-auto: update  # 개발: update, 운영: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false  # OSIV 비활성화 권장

  # Spring Security 설정
  security:
    user:
      name: admin
      password: admin  # 개발용 기본 계정

  # Spring DevTools 설정
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: static/**,public/**
    livereload:
      enabled: true

  # Flyway 설정
  flyway:
    enabled: false  # 임시 비활성화 (마이그레이션 체크섬 오류)
    baseline-on-migrate: true
    locations: classpath:db/migration
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql
    validate-on-migrate: true

  # AWS S3 설정 (개발 환경)
  # S3를 사용하려면 AWS_S3_ENABLED=true 환경 변수와 함께 AWS 자격 증명을 설정하세요
  #
  # 실제 AWS S3 통합 테스트 실행:
  # AWS_INTEGRATION_TEST=true AWS_S3_ENABLED=true AWS_S3_BUCKET=your-test-bucket ./gradlew test --tests S3ServiceIntegrationTest
  cloud:
    aws:
      s3:
        enabled: ${AWS_S3_ENABLED}
        bucket: ${AWS_S3_BUCKET}
      region:
        static: ${AWS_REGION}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      stack:
        auto: false

# ===================================
# JWT 설정
# ===================================
jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key-must-be-at-least-64-characters-for-hs512-algorithm-change-this}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}  # 1시간
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}  # 7일

# ===================================
# 암호화 설정
# ===================================
security:
  encryption:
    key: ${ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}  # 개발용 기본 키 (32바이트)

# ===================================
# 외부 API 설정 (FastAPI)
# ===================================
external:
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
    timeout: ${FASTAPI_TIMEOUT:30000}  # 30초

# ===================================
# AI 서비스 설정
# ===================================
ai:
  face-similarity:
    base-url: ${AI_FACE_SIMILARITY_BASE_URL:https://bubbly-reprieve-production-52a0.up.railway.app}
    connect-timeout-ms: ${AI_FACE_SIMILARITY_CONNECT_TIMEOUT:10000}  # 10초
    read-timeout-s: ${AI_FACE_SIMILARITY_READ_TIMEOUT:30}  # 30초
    write-timeout-s: ${AI_FACE_SIMILARITY_WRITE_TIMEOUT:10}  # 10초
    api-key: ${AI_FACE_SIMILARITY_API_KEY:}  # 환경변수로 주입 (선택사항)

# 서버 설정
server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param  # ?trace=true로 스택 트레이스 확인 가능
    include-exception: false

# 로깅 설정 (개발 환경 - 상세)
logging:
  level:
    root: INFO
    com.concrete.buildup: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # 파라미터 바인딩 로그
    org.hibernate.type.descriptor.sql.BasicExtractor: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc (Swagger) 설정
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html  # context-path /api가 자동으로 적용됨
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# 개발 환경 전용 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
