spring:
  application:
    name: buildup-test

  # 테스트용 데이터베이스 설정 (H2)
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  # Flyway 비활성화 (테스트 환경)
  flyway:
    enabled: false

  # H2 Console 활성화
  h2:
    console:
      enabled: true

  # AWS S3 통합 테스트 설정
  # .env 파일의 환경변수를 사용합니다
  cloud:
    aws:
      s3:
        enabled: ${AWS_S3_ENABLED:false}
        bucket: ${AWS_S3_BUCKET:concrete-build-up}
      region:
        static: ${AWS_REGION:ap-northeast-2}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
      stack:
        auto: false

# 서버 설정 (테스트 환경)
server:
  servlet:
    context-path: /api

# JWT 테스트 설정
jwt:
  secret: test-secret-key-min-256-bits-long-for-hs256-algorithm-test
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
  refresh-token-remember-me-expiration: 2592000000

# 암호화 테스트 설정
security:
  encryption:
    key: 0123456789abcdef0123456789abcdef

# 로깅 설정
logging:
  level:
    root: INFO
    com.concrete.buildup: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
